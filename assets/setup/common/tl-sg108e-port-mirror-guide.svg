<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">TL-SG108E port mirroring settings example</title>
  <desc id="desc">Two possible TP-Link interface layouts. Both configure PS5 port 2 as the mirrored source, PC port 8 as the mirroring destination, and copy both ingress and egress traffic.</desc>
  <defs>
    <style>
      .bg { fill: #f4f7f9; }
      .panel { fill: #ffffff; stroke: #b8c7d1; stroke-width: 2; }
      .header { fill: #006b78; }
      .section { fill: #eaf4f6; }
      .field { fill: #ffffff; stroke: #9fb3bf; stroke-width: 2; }
      .selected { fill: #d8f3e7; stroke: #198754; stroke-width: 2; }
      .button { fill: #006b78; }
      .badge { fill: #ffb000; }
      .title { font: 700 30px 'Segoe UI', Arial, sans-serif; fill: #16323f; }
      .subtitle { font: 18px 'Segoe UI', Arial, sans-serif; fill: #4a6572; }
      .panelTitle { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .label { font: 18px 'Segoe UI', Arial, sans-serif; fill: #263f4a; }
      .value { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #16323f; }
      .small { font: 15px 'Segoe UI', Arial, sans-serif; fill: #4a6572; }
      .white { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .badgeText { font: 700 17px 'Segoe UI', Arial, sans-serif; fill: #1c2e36; text-anchor: middle; dominant-baseline: middle; }
      .tableHead { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #16323f; text-anchor: middle; }
      .tableCell { font: 16px 'Segoe UI', Arial, sans-serif; fill: #263f4a; text-anchor: middle; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="720" rx="20"/>
  <text id="heading" class="title" x="60" y="55">TL-SG108E Port Mirror - settings example</text>
  <text class="subtitle" x="60" y="88">Source / Mirrored: port 2 (PS5)   |   Destination / Mirroring: port 8 (PC)   |   Copy both directions</text>
  <text class="small" x="60" y="116">The exact layout can vary by hardware revision and firmware. Use the panel that matches your screen.</text>

  <g aria-label="Interface with Both mode">
    <rect class="panel" x="55" y="145" width="525" height="505" rx="12"/>
    <path class="header" d="M67 145h501a12 12 0 0 1 12 12v48H55v-48a12 12 0 0 1 12-12z"/>
    <text class="panelTitle" x="80" y="183">Layout A - Mirrored Mode: Both</text>

    <rect class="section" x="80" y="230" width="475" height="44" rx="5"/>
    <text class="value" x="98" y="258">Port Mirror</text>

    <text class="label" x="95" y="315">Port Mirror Status</text>
    <rect class="selected" x="310" y="287" width="185" height="42" rx="5"/>
    <text class="value" x="330" y="314">Enable</text>
    <circle class="badge" cx="520" cy="308" r="17"/>
    <text class="badgeText" x="520" y="309">1</text>

    <text class="label" x="95" y="375">Mirroring Port</text>
    <rect class="selected" x="310" y="347" width="185" height="42" rx="5"/>
    <text class="value" x="330" y="374">8 (PC)</text>
    <circle class="badge" cx="520" cy="368" r="17"/>
    <text class="badgeText" x="520" y="369">2</text>

    <rect class="section" x="80" y="415" width="475" height="44" rx="5"/>
    <text class="value" x="98" y="443">Mirrored Port</text>

    <text class="label" x="95" y="500">Mirrored Mode</text>
    <rect class="selected" x="310" y="472" width="185" height="42" rx="5"/>
    <text class="value" x="330" y="499">Both</text>
    <circle class="badge" cx="520" cy="493" r="17"/>
    <text class="badgeText" x="520" y="494">3</text>

    <text class="label" x="95" y="560">Mirrored Ports</text>
    <rect class="field" x="310" y="532" width="48" height="42" rx="5"/>
    <text class="value" x="328" y="559">1</text>
    <rect class="selected" x="368" y="532" width="48" height="42" rx="5"/>
    <text class="value" x="386" y="559">2</text>
    <rect class="field" x="426" y="532" width="48" height="42" rx="5"/>
    <text class="value" x="444" y="559">3</text>
    <circle class="badge" cx="520" cy="553" r="17"/>
    <text class="badgeText" x="520" y="554">4</text>

    <rect class="button" x="385" y="598" width="110" height="38" rx="6"/>
    <text class="white" x="414" y="623">Apply</text>
  </g>

  <g aria-label="Interface with separate ingress and egress controls">
    <rect class="panel" x="620" y="145" width="525" height="505" rx="12"/>
    <path class="header" d="M632 145h501a12 12 0 0 1 12 12v48H620v-48a12 12 0 0 1 12-12z"/>
    <text class="panelTitle" x="645" y="183">Layout B - separate Ingress / Egress</text>

    <text class="label" x="650" y="250">Port Mirror Status</text>
    <rect class="selected" x="870" y="222" width="190" height="42" rx="5"/>
    <text class="value" x="892" y="249">Enable</text>
    <circle class="badge" cx="1090" cy="243" r="17"/>
    <text class="badgeText" x="1090" y="244">1</text>

    <text class="label" x="650" y="310">Mirroring Port</text>
    <rect class="selected" x="870" y="282" width="190" height="42" rx="5"/>
    <text class="value" x="892" y="309">8 (PC)</text>
    <circle class="badge" cx="1090" cy="303" r="17"/>
    <text class="badgeText" x="1090" y="304">2</text>

    <rect class="section" x="645" y="355" width="475" height="45" rx="5"/>
    <text class="tableHead" x="735" y="383">Mirrored Port</text>
    <text class="tableHead" x="895" y="383">Ingress</text>
    <text class="tableHead" x="1045" y="383">Egress</text>

    <rect class="field" x="645" y="400" width="475" height="50"/>
    <text class="tableCell" x="735" y="431">port 1</text>
    <text class="tableCell" x="895" y="431">Disable</text>
    <text class="tableCell" x="1045" y="431">Disable</text>

    <rect class="selected" x="645" y="450" width="475" height="58"/>
    <text class="tableHead" x="735" y="486">port 2 (PS5)</text>
    <text class="tableHead" x="895" y="486">Enable</text>
    <text class="tableHead" x="1045" y="486">Enable</text>
    <circle class="badge" cx="1090" cy="479" r="17"/>
    <text class="badgeText" x="1090" y="480">3</text>

    <rect class="field" x="645" y="508" width="475" height="50"/>
    <text class="tableCell" x="735" y="539">port 3</text>
    <text class="tableCell" x="895" y="539">Disable</text>
    <text class="tableCell" x="1045" y="539">Disable</text>

    <text class="small" x="650" y="588">Ingress = PS5 sends   |   Egress = PS5 receives</text>
    <rect class="button" x="950" y="598" width="110" height="38" rx="6"/>
    <text class="white" x="979" y="623">Apply</text>
  </g>

  <text class="small" x="60" y="688">After choosing the values shown above, select Apply. Do not select the router uplink (port 1) as the mirrored source.</text>
</svg>
